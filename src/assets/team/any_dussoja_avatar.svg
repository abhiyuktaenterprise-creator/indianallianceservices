<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
    <linearGradient id="skinGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#cf9467" />
      <stop offset="100%" stop-color="#b07243" />
    </linearGradient>
    <linearGradient id="suitGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <linearGradient id="hairGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <!-- Background Circle -->
  <circle cx="100" cy="100" r="98" fill="url(#bgGrad2)" />

  <!-- Inner Soft Glow -->
  <circle cx="100" cy="100" r="90" fill="#f8fafc" fill-opacity="0.1" />

  <!-- Hair Bun / Mature Style -->
  <circle cx="100" cy="62" r="32" fill="url(#hairGrad2)" />

  <!-- Neck -->
  <rect x="88" y="115" width="24" height="28" rx="4" fill="url(#skinGrad2)" />

  <!-- Saree Drape / Top -->
  <polygon points="100,135 84,120 116,120" fill="#d97706" />
  <path d="M 85 125 Q 100 135 115 125" stroke="#fef08a" stroke-width="2" fill="none" />

  <!-- Shoulders & Blazer -->
  <path d="M 36 190 C 40 148, 70 132, 85 130 L 100 152 L 115 130 C 130 132, 160 148, 164 190 Z" fill="url(#suitGrad2)" />
  <polygon points="85,130 100,175 75,190 58,190" fill="#1e1b4b" />
  <polygon points="115,130 100,175 125,190 142,190" fill="#312e81" />

  <!-- Head / Face -->
  <ellipse cx="100" cy="94" rx="29" ry="35" fill="url(#skinGrad2)" />

  <!-- Hair Front (Parted with subtle silver streaks) -->
  <path d="M 71 85 C 71 62, 129 62, 129 85 C 118 73, 108 72, 100 72 C 92 72, 82 73, 71 85 Z" fill="url(#hairGrad2)" />
  <!-- Side Waves -->
  <path d="M 72 78 C 73 95, 78 105, 76 112 C 72 105, 70 95, 72 78 Z" fill="url(#hairGrad2)" />
  <path d="M 128 78 C 127 95, 122 105, 124 112 C 128 105, 130 95, 128 78 Z" fill="url(#hairGrad2)" />

  <!-- Spectacles / Glasses (Gold Rimmed) -->
  <rect x="76" y="84" width="20" height="15" rx="4" stroke="#d97706" stroke-width="2" fill="#ffffff" fill-opacity="0.15" />
  <rect x="104" y="84" width="20" height="15" rx="4" stroke="#d97706" stroke-width="2" fill="#ffffff" fill-opacity="0.15" />
  <line x1="96" y1="91" x2="104" y2="91" stroke="#d97706" stroke-width="2" />
  <line x1="72" y1="89" x2="76" y2="89" stroke="#d97706" stroke-width="1.5" />
  <line x1="124" y1="89" x2="128" y2="89" stroke="#d97706" stroke-width="1.5" />

  <!-- Eyes behind glasses -->
  <circle cx="86" cy="91" r="2.5" fill="#1e293b" />
  <circle cx="114" cy="91" r="2.5" fill="#1e293b" />

  <!-- Nose & Warm Mature Smile -->
  <path d="M 100 91 L 98 100 L 102 100" stroke="#92400e" stroke-width="1.5" fill="none" stroke-linecap="round" />
  <path d="M 92 110 Q 100 117 108 110" stroke="#b91c1c" stroke-width="2.5" fill="none" stroke-linecap="round" />

  <!-- Subtle Pearl Earrings -->
  <circle cx="70" cy="100" r="3.5" fill="#f8fafc" stroke="#d97706" stroke-width="1" />
  <circle cx="130" cy="100" r="3.5" fill="#f8fafc" stroke="#d97706" stroke-width="1" />
</svg>
